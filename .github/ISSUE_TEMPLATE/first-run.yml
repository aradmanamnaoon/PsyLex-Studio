name: First-run Windows experience
description: Tell us where the public installer or local glossary workflow helped or failed. No personal research data.
title: "[First run] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying PsyLex Studio. The public installer is [v0.6.5](../../releases/tag/v0.6.5).
        Reports are optional and do not include tracking. **Never include patient records, full proprietary dictionary entries, confidential research documents, personal identifiers or API tokens**.
        Python 3.13 source installs are not currently supported ([tracking issue](../../issues/1)); the packaged Windows installer is built separately.
  - type: dropdown
    id: stage
    attributes:
      label: Furthest step you actually completed
      options:
        - Could not download or launch installer
        - Installed but the app would not open
        - Opened the app and offline dictionary
        - Looked up invented or public psychology terms
        - Connected an optional local model
        - Reviewed an invented or permitted document with OCR
        - Exported a reviewed test translation
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Test environment
      options:
        - Windows 10
        - Windows 11
        - Other Windows version
        - Python source install
        - Other environment
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked, failed or confused you?
      description: Reproduce with invented sample phrases or public-domain text only. Avoid screenshots containing private content.
    validations:
      required: true
  - type: textarea
    id: expectations
    attributes:
      label: Expected result / improvement suggestion
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue privacy
      options:
        - label: My report contains no patient data, restricted research text, proprietary dictionaries or secrets.
          required: true
